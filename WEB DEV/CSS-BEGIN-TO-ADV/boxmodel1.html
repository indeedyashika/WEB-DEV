<!DOCTYPE html>
<html lang="en" align="center">
    <head>BOX MODEL
        <style>
            div {
                width: 500px;
                height: 100px;
                border: 5px solid black;
                box-sizing: content-box;
                background-color: lightskyblue;
                padding:20px;
                margin-top: 10px;
                margin-bottom:10px;
                align-self: center;
                align-content: center;
            }
        </style>
    </head>
    <body>
        <h2>Box sizing: content-box</h2>
        <div>This is a content box.</div>
    </body>
    </body>
</html>
