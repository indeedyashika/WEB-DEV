<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navigation Menu Demo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    h1 {
      text-align: center;
      color: #333333;
    }

    h2 {
      margin-top: 30px;
      color: #CC0000;
    }

    .block a {
      display: block;
      background-color: #000000;
      color: #FF6347;
      padding: 10px;
      text-decoration: none;
      margin-bottom: 5px;
    }

    .inline a {
      display: inline;
      background-color: #8B0000;
      color: #FFFFFF;
      padding: 5px 10px;
      text-decoration: none;
      margin-right: 5px;
    }

    .inline-block a {
      display: inline-block;
      background-color: #333333;
      color: #FF4500;
      padding: 10px 15px;
      text-decoration: none;
      margin-right: 10px;
      margin-bottom: 5px;
    }

    .float a {
      float: left;
      background-color: #1A1A1A;
      color: #DC143C;
      padding: 10px 15px;
      text-decoration: none;
      margin-right: 10px;
      margin-bottom: 10px;
    }

    .float::after {
      content: "";
      display: block;
      clear: both;
    }
    
    body {
      background-color: #F0F0F0;
      color: #333333;
    }
  </style>
</head>
<body>
  <h1>Navigation Menu Demo</h1>

  <h2>Block Example</h2>
  <div class="block">
    <a href="#">Home</a>
    <a href="#">Products</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
  </div>

  <h2>Inline Example</h2>
  <div class="inline">
    <a href="#">Home</a>
    <a href="#">Products</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
  </div>

  <h2>Inline-Block Example</h2>
  <div class="inline-block">
    <a href="#">Home</a>
    <a href="#">Products</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
  </div>

  <h2>Float Example</h2>
  <div class="float">
    <a href="#">Home</a>
    <a href="#">Products</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
  </div>
</body>
</html>
