<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Student Portal</title>
        <style>
            :root {
                --main-pink: #ff8fb1;
                --soft-pink: #ffdae9;
                --soft-blue: #dbedff;
                --soft-yellow: #fff4d1;
                --soft-green: #e2fce6;
            }

            body {
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                background-color: #faf5ff;
                margin: 0;
                padding: 20px;
                color: #5d5d7a;
            }

            .container {
                max-width: 700px; 
                margin: 0 auto;
            }

            header {
                text-align: center;
                margin-bottom: 30px;
            }

            .profile-card {
                background: #ffffff;
                padding: 30px;
                border-radius: 30px;
                border: 5px solid var(--soft-pink);
                box-shadow: 8px 8px 0px var(--soft-pink);
                margin-bottom: 30px;
                display: flex;
                align-items: center;
                gap: 30px;
            }

            .info-sheet {
                background: #ffffff;
                padding: 25px;
                border-radius: 30px;
                border: 5px solid var(--soft-blue);
                box-shadow: 8px 8px 0px var(--soft-blue);
                margin-bottom: 30px;
            }

            .grid-container {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
                gap: 20px;
            }

            /* Tablet and Mobile Adjustments */
            @media (max-width: 600px) {
                body { padding: 15px; }
                
                .profile-card {
                    flex-direction: column;
                    text-align: center;
                    padding: 20px;
                    gap: 15px;
                }

                h1 { font-size: 2rem !important; }
                
                .info-sheet td {
                    padding: 10px !important;
                    font-size: 0.9rem;
                }

                .profile-card h2 { font-size: 1.5rem !important; }
            }
        </style>
    </head>
    <body>

        <div class="container">
            
            <header>
                <h1 style="color: var(--main-pink); margin: 0; font-size: 2.5rem; letter-spacing: 2px; text-transform: uppercase;">Student Profile</h1>
                <div style="height: 6px; width: 80px; background: #bde0fe; margin: 10px auto; border-radius: 10px;"></div>
                <p style="font-size: 0.9rem; color: #a2a2c2; text-transform: uppercase; letter-spacing: 3px; margin: 0;">Academic Records</p>
            </header>

            <section class="profile-card">
                <div style="flex-shrink: 0;">
                    <div style="width: 120px; height: 120px; background: #fdf2f8; border-radius: 30px; border: 3px solid var(--soft-pink); display: flex; align-items: center; justify-content: center; overflow: hidden; margin: 0 auto;">
                        <img src="C:\Users\Yashika Nayak\OneDrive\Pictures\images\hoshinoai.gif" alt="Profile" style="width: 100%; height: 100%; object-fit: cover;">
                    </div>
                </div>
                <div style="flex-grow: 1;">
                    <h2 style="font-size: 1.8rem; color: var(--main-pink); margin: 0 0 10px 0;">Yashika Nayak</h2>
                    <div style="display: flex; flex-direction: column; gap: 6px;">
                        <div style="background: #f0f9ff; color: #0077b6; padding: 6px 12px; border-radius: 15px; display: inline-block; width: fit-content; font-weight: bold; font-size: 0.85rem; border: 2px solid #bde0fe; margin: 0 auto 5px 0;">Computer Science</div>
                        <p style="margin: 2px 0; font-size: 0.95rem;">Email: <span style="color: var(--main-pink);">indeedyashika@gmail.com</span></p>
                        <p style="margin: 2px 0; font-size: 0.95rem;">Contact: 1234567890</p>
                    </div>
                </div>
            </section>

            <section class="info-sheet">
                <h3 style="color: #4895ef; margin-top: 0; margin-bottom: 20px; text-align: center; font-size: 1.3rem;">Information Sheet</h3>
                <table style="width: 100%; border-collapse: separate; border-spacing: 0 8px;">
                    <tr>
                        <td style="padding: 12px; background: #f8fbff; border-radius: 15px 0 0 15px; font-weight: bold; width: 45%;">Full Name</td>
                        <td style="padding: 12px; background: #f8fbff; border-radius: 0 15px 15px 0; text-align: right;">Yashika Nayak</td>
                    </tr>
                    <tr>
                        <td style="padding: 12px; background: #fff9fb; border-radius: 15px 0 0 15px; font-weight: bold;">Roll Number</td>
                        <td style="padding: 12px; background: #fff9fb; border-radius: 0 15px 15px 0; text-align: right;">CS2025001</td>
                    </tr>
                    <tr>
                        <td style="padding: 12px; background: #f8fbff; border-radius: 15px 0 0 15px; font-weight: bold;">Date of Birth</td>
                        <td style="padding: 12px; background: #f8fbff; border-radius: 0 15px 15px 0; text-align: right;">2006-07-07</td>
                    </tr>
                </table>
            </section>

            <div class="grid-container">
                <div style="background: #ffffff; padding: 25px; border-radius: 30px; border: 5px solid var(--soft-green); box-shadow: 8px 8px 0px var(--soft-green);">
                    <h3 style="color: #4cc9f0; margin-top: 0; border-bottom: 3px solid var(--soft-green); padding-bottom: 8px;">Abilities</h3>
                    <ul style="list-style: none; padding: 0; margin: 10px 0 0 0;">
                        <li style="margin: 8px 0; padding-left: 20px; position: relative; font-size: 0.95rem;"><span style="position: absolute; left: 0; color: #4cc9f0;">+</span> HTML & CSS</li>
                        <li style="margin: 8px 0; padding-left: 20px; position: relative; font-size: 0.95rem;"><span style="position: absolute; left: 0; color: #4cc9f0;">+</span> JavaScript</li>
                    </ul>
                </div>

                <div style="background: #ffffff; padding: 25px; border-radius: 30px; border: 5px solid var(--soft-yellow); box-shadow: 8px 8px 0px var(--soft-yellow);">
                    <h3 style="color: #f7b267; margin-top: 0; border-bottom: 3px solid var(--soft-yellow); padding-bottom: 8px;">Interests</h3>
                    <ul style="list-style: none; padding: 0; margin: 10px 0 0 0;">
                        <li style="margin: 8px 0; padding-left: 20px; position: relative; font-size: 0.95rem;"><span style="position: absolute; left: 0; color: #f7b267;">o</span> Reading</li>
                        <li style="margin: 8px 0; padding-left: 20px; position: relative; font-size: 0.95rem;"><span style="position: absolute; left: 0; color: #f7b267;">o</span> Challenges</li>
                    </ul>
                </div>
            </div>
        </div>
    </body>
</html>
